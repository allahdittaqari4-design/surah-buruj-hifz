<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>مصحفِ حفظ — سورۃ البروج | مائیک چیک</title>
<style>
  body{font-family:system-ui,-apple-system,"Noto Naskh Arabic","Noto Sans Arabic",sans-serif;background:#f5f7f5;margin:0;color:#172018}
  .wrap{max-width:850px;margin:auto;padding:16px}
  h1{text-align:center;margin:8px 0 4px}
  .sub{text-align:center;color:#59645b;margin-bottom:14px}
  .card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}
  .ayah{font-size:29px;line-height:2.15;text-align:right}
  button{border:0;border-radius:12px;padding:13px 17px;font-size:17px;margin:4px;cursor:pointer}
  #start{background:#176b3a;color:#fff}
  #stop{background:#a52b2b;color:#fff}
  #status{font-weight:700;text-align:center;margin:10px 0}
  #heard{background:#f0f3f0;border-radius:12px;padding:10px;min-height:28px}
  .ok{color:#176b3a}
  .bad{color:#b32121;text-decoration:underline;font-weight:800;background:#ffe0e0;border-radius:4px;padding:1px 3px}
  .target-word{padding:2px 3px;border-radius:6px}
  .ayah-separator{color:#888;font-size:22px;padding:0 4px}
  .small{font-size:13px;color:#6b746c;line-height:1.7}
  .controls{text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>سورۃ البروج — حفظ سنانے والا</h1>
  <div class="sub">مائیک دبائیں، پوری سورت پڑھتے جائیں؛ ایپ صرف غلطی پر نشاندہی کرے گی۔</div>

  <div class="card controls">
    <button id="start">🎙️ سننا شروع کریں</button>
    <button id="micTest" style="background:#315a8a;color:#fff">🎤 مائیک چیک کریں</button>
    <button id="stop">⏹️ بند کریں</button>
    <div id="status">تیار ہے</div>
  </div>

  <div class="card">
    <div id="ayah" class="ayah"></div>
    <hr>
    <div class="small">آپ کی آواز سے پہچانے گئے الفاظ:</div>
    <div id="heard">—</div>
    <div id="message" class="small"></div>
  </div>
</div>

<script>
const fullSurah = "وَالسَّمَاءِ ذَاتِ الْبُرُوجِ ﴿١﴾ وَالْيَوْمِ الْمَوْعُودِ ﴿٢﴾ وَشَاهِدٍ وَمَشْهُودٍ ﴿٣﴾ قُتِلَ أَصْحَابُ الْأُخْدُودِ ﴿٤﴾ النَّارِ ذَاتِ الْوَقُودِ ﴿٥﴾ إِذْ هُمْ عَلَيْهَا قُعُودٌ ﴿٦﴾ وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِالْمُؤْمِنِينَ شُهُودٌ ﴿٧﴾ وَمَا نَقَمُوا مِنْهُمْ إِلَّا أَنْ يُؤْمِنُوا بِاللَّهِ الْعَزِيزِ الْحَمِيدِ ﴿٨﴾ الَّذِي لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ ﴿٩﴾ إِنَّ الَّذِينَ فَتَنُوا الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ ثُمَّ لَمْ يَتُوبُوا فَلَهُمْ عَذَابُ جَهَنَّمَ وَلَهُمْ عَذَابُ الْحَرِيقِ ﴿١٠﴾ إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ جَنَّاتٌ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ ذَٰلِكَ الْفَوْزُ الْكَبِيرُ ﴿١١﴾ إِنَّ بَطْشَ رَبِّكَ لَشَدِيدٌ ﴿١٢﴾ إِنَّهُ هُوَ يُبْدِئُ وَيُعِيدُ ﴿١٣﴾ وَهُوَ الْغَفُورُ الْوَدُودُ ﴿١٤﴾ ذُو الْعَرْشِ الْمَجِيدُ ﴿١٥﴾ فَعَّالٌ لِمَا يُرِيدُ ﴿١٦﴾ هَلْ أَتَاكَ حَدِيثُ الْجُنُودِ ﴿١٧﴾ فِرْعَوْنَ وَثَمُودَ ﴿١٨﴾ بَلِ الَّذِينَ كَفَرُوا فِي تَكْذِيبٍ ﴿١٩﴾ وَاللَّهُ مِنْ وَرَائِهِمْ مُحِيطٌ ﴿٢٠﴾ بَلْ هُوَ قُرْآنٌ مَجِيدٌ ﴿٢١﴾ فِي لَوْحٍ مَحْفُوظٍ ﴿٢٢﴾";

let recognition=null, listening=false;
let finalText="";
let interimText="";

const ayahEl=document.getElementById("ayah");
const heardEl=document.getElementById("heard"), msgEl=document.getElementById("message");
const statusEl=document.getElementById("status");

function cleanText(s){
  return s.normalize("NFD")
    .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,"")
    .replace(/[إأٱآ]/g,"ا").replace(/ى/g,"ی").replace(/ي/g,"ی")
    .replace(/ؤ/g,"و").replace(/ئ/g,"ی")
    .replace(/[ـۖۗۚۛۜۙۘۚۛ۞]/g,"")
    .replace(/[،؛,.!?؟]/g," ")
    .replace(/[^\u0600-\u06FF\s]/g," ")
    .replace(/\s+/g," ").trim();
}
function words(s){return cleanText(s).split(" ").filter(Boolean)}

// ✅ نیا فنکشن: Fuzzy Matching (لفظوں کو جوڑ کر موازنہ کریں)
function checkFinalText(){
  if(!finalText.trim()) return;
  
  const targetWords = words(fullSurah);
  const gotWords = words(finalText);
  
  if(!gotWords.length) return;
  
  // ✅ لکھائی دکھائیں (لفظ بہ لفظ، لیکن صرف غلطی پر لال)
  let displayHtml = "";
  let errorCount = 0;
  
  // ہم لفظ بہ لفظ موازنہ کریں گے، لیکن اگر ایک لفظ قرآن میں دو الفاظ میں ہے، تو اسے نظر انداز کریں گے
  let targetIdx = 0;
  let gotIdx = 0;
  
  while(gotIdx < gotWords.length && targetIdx < targetWords.length){
    const targetWord = targetWords[targetIdx];
    const gotWord = gotWords[gotIdx];
    
    if(targetWord === gotWord){
      displayHtml += `<span class="ok">${gotWord}</span> `;
      targetIdx++;
      gotIdx++;
    } else {
      // ✅ چیک کریں: کیا اگلے لفظ کے ساتھ مل کر یہ قرآن کا لفظ بنتا ہے؟
      if(gotIdx+1 < gotWords.length){
        const combined = gotWords[gotIdx] + " " + gotWords[gotIdx+1];
        const combinedNoSpace = gotWords[gotIdx] + gotWords[gotIdx+1];
        
        if(targetWord === combined || targetWord === combinedNoSpace){
          // یہ دو الفاظ مل کر قرآن کا ایک لفظ بناتے ہیں
          displayHtml += `<span class="ok">${gotWord} ${gotWords[gotIdx+1]}</span> `;
          targetIdx++;
          gotIdx += 2;
          continue;
        }
      }
      
      // اگر میل نہیں کھاتا، تو غلطی
      displayHtml += `<span class="bad">${gotWord}</span> `;
      errorCount++;
      targetIdx++;
      gotIdx++;
    }
  }
  
  // باقی الفاظ جو صارف نے پڑھے لیکن قرآن میں نہیں
  while(gotIdx < gotWords.length){
    displayHtml += `<span class="bad">${gotWords[gotIdx]}</span> `;
    errorCount++;
    gotIdx++;
  }
  
  heardEl.innerHTML = displayHtml || "—";
  
  // ✅ صرف غلطی پر پیغام
  if(errorCount > 0){
    msgEl.innerHTML = `<b class="bad">⚠️ ${errorCount} لفظ(وں) میں فرق ہے</b>`;
    statusEl.textContent = "⚠️ غلطی — صحیح پڑھیں";
  } else {
    msgEl.innerHTML = "";
    statusEl.textContent = "🎙️ سن رہا ہوں…";
  }
  
  // ✅ پوری سورت مکمل
  if(gotWords.length >= targetWords.length && errorCount === 0){
    msgEl.innerHTML = '<b class="ok">✅ سورت مکمل</b>';
    statusEl.textContent = "✅ مکمل";
    listening = false;
    if(recognition) recognition.stop();
  }
}

function makeRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){statusEl.textContent="اس براؤزر میں آواز پہچاننے کی سہولت نہیں۔ Chrome استعمال کریں۔";return null;}
  const r=new SR();
  r.lang="ar-SA"; r.continuous=true; r.interimResults=true;
  
  r.onstart=()=>{
    listening=true; finalText=""; interimText="";
    statusEl.textContent="🎙️ سن رہا ہوں…";
  };
  r.onerror=e=>{statusEl.textContent="مائیک کا مسئلہ: "+e.error;};
  r.onend=()=>{if(listening){try{r.start()}catch(e){}}else statusEl.textContent="سننا بند";};
  
  r.onresult=e=>{
    let interim="";
    for(let j=e.resultIndex;j<e.results.length;j++){
      const t=e.results[j][0].transcript.trim();
      if(e.results[j].isFinal){
        finalText += (finalText ? " " : "") + t;
      } else {
        interim += (interim ? " " : "") + t;
      }
    }
    interimText = interim;
    
    // ✅ فوری لکھائی
    const displayText = (finalText + " " + interimText).trim();
    if(displayText){
      let displayWords = words(displayText);
      let displayHtml = "";
      const targetWords = words(fullSurah);
      
      for(let k=0; k<displayWords.length; k++){
        if(k < targetWords.length && targetWords[k] === displayWords[k]){
          displayHtml += `<span class="ok">${displayWords[k]}</span> `;
        } else {
          displayHtml += `<span class="bad">${displayWords[k]}</span> `;
        }
      }
      heardEl.innerHTML = displayHtml || "—";
    }
    
    if(finalText.trim()){
      checkFinalText();
    }
  };
  return r;
}

document.getElementById("micTest").onclick=async()=>{
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      statusEl.textContent="اس ماحول میں مائیک کی اجازت نہیں۔ Chrome کے HTTPS صفحے میں کھولیں۔";
      return;
    }
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop());
    statusEl.textContent="✅ مائیک کی اجازت مل گئی۔";
  }catch(e){
    statusEl.textContent="❌ مائیک کی اجازت نہیں ملی۔";
  }
};
document.getElementById("start").onclick=()=>{
  if(!recognition) recognition=makeRecognition();
  if(recognition){listening=true;finalText="";interimText="";try{recognition.start()}catch(e){}}
};
document.getElementById("stop").onclick=()=>{
  listening=false;
  if(recognition) recognition.stop();
  statusEl.textContent="سننا بند";
};

// انیشیئلائز
const ws = fullSurah.split(" ");
ayahEl.innerHTML = ws.map(w=>{
  if(w.includes("﴿") || w.includes("﴾")){
    return `<span class="ayah-separator">${w}</span>`;
  }
  return `<span class="target-word">${w}</span>`;
}).join(" ");
</script>
</body>
</html>
